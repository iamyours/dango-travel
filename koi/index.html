            stem.position.y = -0.022;
            const f1 = new THREE.Mesh(geos.floretGeo, mats.broccoliTop);
            f1.position.set(-0.026, 0.018, 0.015);
            const f2 = new THREE.Mesh(geos.floretGeo, mats.broccoliTop);
            f2.position.set(0.026, 0.022, 0.012);
            const f3 = new THREE.Mesh(geos.floretGeo, mats.mugwort2);
            f3.position.set(0, 0.028, -0.024);
            f1.castShadow = true;
            f2.castShadow = true;
            g.add(stem, f1, f2, f3);
          } else {
            // White rice clump
            const r1 = new THREE.Mesh(geos.ricePuffGeo, mats.rice);
            r1.position.set(-0.024, 0, -0.012);
            const r2 = new THREE.Mesh(geos.ricePuffGeo, mats.rice);
            r2.position.set(0.026, 0.008, 0.014);
            const r3 = new THREE.Mesh(geos.riceGrainGeo, mats.rice);
            r3.position.set(0, 0.024, -0.004);
            r1.castShadow = true;
            r2.castShadow = true;
            g.add(r1, r2, r3);
          }
        } else if (foodId === 'vbento') {
          const kind = index % 3;
          if (kind === 0) {
            // Red tomato wedge/half with lighter inside
            const skin = new THREE.Mesh(geos.tomatoOuterGeo, mats.tomatoSkin);
            skin.position.y = 0.02;
            const flesh = new THREE.Mesh(geos.tomatoInnerGeo, mats.tomatoFlesh);
            flesh.position.y = 0.02;

          } else if (kind === 1) {

            const leaf2 = new THREE.Mesh(geos.basilLeafGeo, mats.mugwort2);
            leaf2.scale.set(0.65, 0.7, 0.65);
            leaf2.position.set(0.02, 0.01, 0.015);

          } else {

      // Spawn a 3D droplet splash burst when a koi gulps a pellet
      function spawnGulpSplash(x, z) {
        const dropletCount = 14;
        const group = new THREE.Group();
        group.position.set(x, 0.03, z);
        const dropGeo = new THREE.SphereGeometry(0.032, 6, 6);
        const dropMat = new THREE.MeshBasicMaterial({
          color: 0xe0f2fe,
          transparent: true,
          opacity: 0.9
        });
        const drops = [];
        for (let i = 0; i < dropletCount; i++) {
          const m = new THREE.Mesh(dropGeo, dropMat);
          const ang = (i / dropletCount) * Math.PI * 2 + Math.random() * 0.4;
          const spd = 0.8 + Math.random() * 1.4;
          group.add(m);
          drops.push({
            mesh: m,
            vx: Math.cos(ang) * spd,
            vy: 1.6 + Math.random() * 1.6,
            vz: Math.sin(ang) * spd
          });

        scene.add(group);
        splashBursts.push({ group, drops, mat: dropMat, age: 0 });

      // Shop foods share the game's cozy-tabi-v3 inventory. One item = one handful.
      const SAVE_KEY = 'cozy-tabi-v3';
      const SHOP_FOODS = [
        { id: 'bun', get n() { return I18N.t('food.' + this.id + '.n'); }, ic: '🍡', color: 0xc5e6a0, emissive: 0x3f6b32, size: 1.05, pellets: 8 },

      function readGameSave() {
        try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }
        catch (e) { return null; }
      }
      function stockList() {
        const save = readGameSave();
        const inv = save && save.inv && typeof save.inv === 'object' ? save.inv : {};
        return SHOP_FOODS
          .map((f) => ({ ...f, n: I18N.t('food.' + f.id + '.n'), count: typeof inv[f.id] === 'number' ? inv[f.id] : 0 }))
          .filter((f) => f.count > 0);
      }
      function currentFood() {
        const stock = stockList();
        if (!stock.length) return null;
        if (!stock.some((f) => f.id === selectedFood)) selectedFood = stock[0].id;
        return stock.find((f) => f.id === selectedFood);
      }
      function consumeFood(id) {
        const save = readGameSave();
        if (!save || !save.inv || typeof save.inv[id] !== 'number' || save.inv[id] <= 0) return null;
        save.inv[id] -= 1;
        localStorage.setItem(SAVE_KEY, JSON.stringify(save));
        try { parent.postMessage({ type: 'dango-inv', inv: save.inv }, location.origin); } catch (e) {}
        return save.inv;

      function refreshFoodUI() {
        const stock = stockList();

        feedBtn.disabled = !food;

        noFoodMsg.classList.toggle('hidden', !!food);

      function spotInFront() {
        const p = xiaotuan.group.position;
        let tx = p.x * 0.28 + (Math.random() - 0.5) * 2.2;
        let tz = p.z * 0.34 + (Math.random() - 0.5) * 1.5;
        const m = getPondMetrics(tx, tz);
        if (m.normDist > 0.7) {
          tx = Math.cos(m.theta) * m.maxR * 0.48;
          tz = Math.sin(m.theta) * m.maxR * 0.48;
        }
        return { x: tx, z: tz };
      }

      // Spawn the actual food piece models from the hand position at release moment (~45% of tossDur)
      function spawnQueuedThrowPellets(req, origin) {
        const { centerX, centerZ, count, food } = req;
        const foodId = food ? food.id : 'bun';
        const baseScale = food ? food.size : 1.0;
        const PIECE_WORLD_SCALE = 2.5;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spread = Math.sqrt(Math.random()) * (count > 6 ? 1.7 : 1.05);
          let px = centerX + Math.cos(angle) * spread;
          let pz = centerZ + Math.sin(angle) * spread;
          const metrics = getPondMetrics(px, pz);
          if (metrics.normDist > 0.74) {
            px = Math.cos(metrics.theta) * (metrics.maxR * 0.62);
            pz = Math.sin(metrics.theta) * (metrics.maxR * 0.62);
          }
          const mesh = createFoodPieceMesh(foodId, i);
          mesh.scale.setScalar(PIECE_WORLD_SCALE * baseScale * (0.9 + Math.random() * 0.24));
          mesh.position.copy(origin);
          mesh.position.x += (Math.random() - 0.5) * 0.14;
          mesh.position.z += (Math.random() - 0.5) * 0.14;
          mesh.rotation.set(
            (Math.random() - 0.5) * 1.4,
            Math.random() * Math.PI * 2,
            (Math.random() - 0.5) * 1.4
          );
          scene.add(mesh);
          const flight = 0.72 + Math.random() * 0.24;
          const g = 9.8;
          pellets.push({
            mesh,
            targetX: px,
            targetZ: pz,
            vx: (px - mesh.position.x) / flight,
            vz: (pz - mesh.position.z) / flight,
            vy: (0.02 - mesh.position.y + 0.5 * g * flight * flight) / flight,
            rxSpeed: (Math.random() - 0.5) * 9.5,
            rySpeed: (Math.random() - 0.5) * 7.5,
            rzSpeed: (Math.random() - 0.5) * 9.5,
            restRx: (Math.random() - 0.5) * 0.16,
            restRz: (Math.random() - 0.5) * 0.16,
            landed: false,
            eaten: false,
            bobPhase: Math.random() * Math.PI * 2
          });
        }
      }

      // Queue a pending throw; pellets leave 小团's hand at the release moment in updateXiaotuan.
      function tossFoodPellets(centerX, centerZ, count, food) {
        const hadUnspawned = xiaotuan.pendingThrows.length > 0;
        xiaotuan.pendingThrows.push({ centerX, centerZ, count, food });
        showHeldFoodInHand(food ? food.id : 'bun');
        // Start or cleanly restart toss if not already mid-windup
        if (!hadUnspawned || xiaotuan.toss <= 0) {
          xiaotuan.toss = xiaotuan.tossDur;
        }
      }

      function beginFeed(tx, tz) {
        const food = currentFood();
        if (!food) {
          refreshFoodUI();
          showToast(I18N.t('koi.toast.noFood'));
          return false;
        }
        if (!consumeFood(food.id)) {
          refreshFoodUI();
          showToast(I18N.t('koi.toast.noFood'));
          return false;
        }
        tossFoodPellets(tx, tz, food.pellets, food);
        refreshFoodUI();
        showToast(I18N.t('koi.toast.fed', { ic: food.ic, n: food.n }));
        return true;
      }

      // Clicking the water spends the same shop food and tosses from 小团.
      const raycaster = new THREE.Raycaster();
      const pointerDownPos = new THREE.Vector2();
      const pointerUpPos = new THREE.Vector2();

      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos.set(e.clientX, e.clientY);
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        pointerUpPos.set(e.clientX, e.clientY);
        if (pointerDownPos.distanceTo(pointerUpPos) < 6) {
          const ndc = new THREE.Vector2(
            (e.clientX / window.innerWidth) * 2 - 1,
            -(e.clientY / window.innerHeight) * 2 + 1
          );
          raycaster.setFromCamera(ndc, camera);
          const hits = raycaster.intersectObject(waterMesh);
          if (hits.length > 0) {
            const pt = hits[0].point;
            const { normDist } = getPondMetrics(pt.x, pt.z);
            if (normDist < 0.92) beginFeed(pt.x, pt.z);
          }

      });

      // ============================================================================
      // 13. UI CONTROLS: AMBIANCE MODES, PAINTED BACKDROP, CAMERA PRESETS & SOUND
      // ============================================================================
      // BG_PANO_V5: Single-wrap 360° 3-plate panorama cylinder backdrop (6144x1101, 1:1 native pixel aspect; per-mode lazy-load of bg_day.jpg, bg_sunset.jpg, bg_night.jpg)
      const BACKDROP_ASPECT = 5.380035026269702;
      const BACKDROP_H = 46;   // sun/moon elevation stays reasonable (~30°)
      const BACKDROP_R = (BACKDROP_H * BACKDROP_ASPECT) / (2 * Math.PI);  // ≈ 40.85
      console.assert(Math.abs(((2*Math.PI*BACKDROP_R)/BACKDROP_H) / (6144/1142) - 1) < 0.01, 'backdrop aspect not 1:1');
      console.info('BG_PANO_V5 backdrop aspect:', (2 * Math.PI * BACKDROP_R) / BACKDROP_H, 6144 / 1142);

      // Flat grass continuation ring (innerRadius ~20.4 outside pond & bank rocks, outerRadius BACKDROP_R + 2 ≈ 42.85) slightly below bed's outer height
      const groundDiscGeo = new THREE.RingGeometry(GROUND_RING_INNER_R, BACKDROP_R + 2, 96, 2);
      groundDiscGeo.rotateX(-Math.PI / 2);
      const groundDiscMat = new THREE.MeshBasicMaterial({
        color: 0x59654d,
        toneMapped: false,
        fog: false,
        polygonOffset: true,
        polygonOffsetFactor: 2,
        polygonOffsetUnits: 2
      });
      const groundDiscMesh = new THREE.Mesh(groundDiscGeo, groundDiscMat);
      groundDiscMesh.position.y = OUTER_GROUND_Y - 0.02;
      scene.add(groundDiscMesh);

      function updateGroundGrassColor(plateGrassHex, bedGrassHex) {
        groundDiscMat.color.setHex(plateGrassHex);
        bedUniforms.uPlateGrassColor.value.setHex(plateGrassHex);
        const gc = new THREE.Color(bedGrassHex !== undefined ? bedGrassHex : plateGrassHex);
        for (let i = 0; i < bedPos.count; i++) {
          const w = bedGrassWeights[i];
          if (w <= 0) continue;
          const idx = i * 3;
          bedColors[idx] = THREE.MathUtils.lerp(bedBaseColors[idx], gc.r, w);
          bedColors[idx + 1] = THREE.MathUtils.lerp(bedBaseColors[idx + 1], gc.g, w);
          bedColors[idx + 2] = THREE.MathUtils.lerp(bedBaseColors[idx + 2], gc.b, w);
        }
        bedColorAttr.needsUpdate = true;
      }

      // Align front plate centre (u = 0.25) with default overview camera horizontal look direction: (7.2, 10.6, 15.4) -> (-4.2, 0.55, 0.4)
      const BACKDROP_REF_CAM = new THREE.Vector3(7.2, 10.6, 15.4);
      const BACKDROP_REF_TARGET = new THREE.Vector3(-4.2, 0.55, 0.4);
      const BACKDROP_FRONT_DIR = new THREE.Vector2(
        BACKDROP_REF_TARGET.x - BACKDROP_REF_CAM.x,
        BACKDROP_REF_TARGET.z - BACKDROP_REF_CAM.z
      ).normalize();
      const BACKDROP_FRONT_U = 0.25;
      // CylinderGeometry places u_geo at theta_geo = 2π * u_geo (x = R sin θ, z = R cos θ).
      // Compensating BackSide horizontal flip via tex.repeat.x = -1, tex.offset.x = 1 maps image u to u_geo = 1 - u (local angle -2πu),
      // so after mesh.rotation.y = BACKDROP_ROT_Y a given u has world azimuth θ(u) = BACKDROP_ROT_Y - 2πu (increasing u goes left-to-right from inside).
      const BACKDROP_ROT_Y = Math.atan2(BACKDROP_FRONT_DIR.x, BACKDROP_FRONT_DIR.y) + 2 * Math.PI * BACKDROP_FRONT_U;
      const BACKDROP_SUN_U = { day: 0.7485, sunset: 0.2505, night: 0.2534 };
      const BACKDROP_SEAMS_U = { front_back: 0.4167, back_side: 0.7501, side_front: 0.0834 };
      const BACKDROP_URLS = {
        day: 'assets/bg_day.jpg',
        sunset: 'assets/bg_sunset.jpg',
        night: 'assets/bg_night.jpg'
      };

      function backdropDirForU(u) {
        const theta = BACKDROP_ROT_Y - 2 * Math.PI * u;
        return new THREE.Vector3(Math.sin(theta), 0, Math.cos(theta));
      }

      let currentAmbianceMode = 'day';
      const backdropState = {
        started: false,
        textures: { day: null, sunset: null, night: null },
        loading: { day: false, sunset: false, night: false },
        loader: null,
        mesh: null,
        mat: null,
        geo: null
      };

      function ensureBackdropMesh() {
        if (backdropState.mesh) return backdropState.mesh;
        // Open cylinder, radius R≈40.85, height 46, BackSide, opaque, fog:false, toneMapped:false, depthWrite:false, unlit
        const geo = new THREE.CylinderGeometry(BACKDROP_R, BACKDROP_R, BACKDROP_H, 96, 24, true);
        const mat = new THREE.MeshBasicMaterial({
          side: THREE.BackSide,
          fog: false,
          toneMapped: false,
          depthWrite: false,
          transparent: false,
          vertexColors: false,
          color: 0xffffff
        });
        const mesh = new THREE.Mesh(geo, mat);
        // Bottom edge at outer ground height minus 0.15 so the plate's bottom grass strip sits deeper into the 3D ground ring
        mesh.position.set(0, OUTER_GROUND_Y - 0.15 + BACKDROP_H * 0.5, 0);
        mesh.rotation.y = BACKDROP_ROT_Y;
        mesh.renderOrder = -2;
        mesh.visible = false;
        scene.add(mesh);
        backdropState.geo = geo;
        backdropState.mat = mat;
        backdropState.mesh = mesh;
        return mesh;
      }
      ensureBackdropMesh();

      function configureBackdropTexture(tex) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.repeat.set(-1, 1);
        tex.offset.set(1, 0);
        tex.needsUpdate = true;
      }

      function loadBackdropTextureForMode(mode) {
        const url = BACKDROP_URLS[mode];
        if (!backdropState.started || !url || backdropState.textures[mode] || backdropState.loading[mode]) return;
        backdropState.loading[mode] = true;
        try {
          if (!backdropState.loader) backdropState.loader = new THREE.TextureLoader();
          backdropState.loader.load(
            url,
            function (tex) {
              backdropState.loading[mode] = false;
              configureBackdropTexture(tex);
              backdropState.textures[mode] = tex;
              if (currentAmbianceMode === mode) {
                syncBackdropToAmbiance(currentAmbianceMode);
              }
            },
            undefined,
            function () {
              backdropState.loading[mode] = false;
              if (currentAmbianceMode === mode && backdropState.mesh) {
                backdropState.mesh.visible = false;
              }
            }
          );
        } catch (e) {
          backdropState.loading[mode] = false;
        }
      }

      function syncBackdropToAmbiance(mode) {
        const mesh = ensureBackdropMesh();
        const mat = backdropState.mat;
        const tex = backdropState.textures[mode] || null;
        if (!tex) {
          mesh.visible = false;
          if (backdropState.started) {
            loadBackdropTextureForMode(mode);
          }
          return false;
        }
        if (mat.map !== tex) {
          mat.map = tex;
          mat.needsUpdate = true;
        }
        mat.color.setHex(0xffffff);
        mesh.visible = true;
        return true;
      }

      function startBackdropLazyLoad() {
        if (backdropState.started) return;
        backdropState.started = true;
        loadBackdropTextureForMode(currentAmbianceMode);
      }

      // TOD_DEFAULT_V2: Apply lighting mode and sync .mode-btn active state; default from local clock (or ?tod= override)
      const modeButtons = document.querySelectorAll('.mode-btn');
      function applyAmbianceMode(mode) {
        const validMode = mode === 'sunset' || mode === 'night' || mode === 'day' ? mode : 'day';
        currentAmbianceMode = validMode;
        modeButtons.forEach((b) => {
          b.classList.toggle('active', b.getAttribute('data-mode') === validMode);
        });

        let koiEmissive = 0.0;
        let finEmissive = 0.0;
        let plateGrassHex = 0x59654d;
        let bedGrassHex = 0x657d42;

        if (validMode === 'day') {
          scene.background.setHex(0xb5d7e8);
          scene.fog.color.setHex(0x59654d);
          plateGrassHex = 0x59654d;
          bedGrassHex = 0x657d42;
          hemiLight.color.setHex(0xdff4ff);
          hemiLight.groundColor.setHex(0x2a4834);
          hemiLight.intensity = 0.78;
          sunLight.color.setHex(0xfff5e0);
          sunLight.intensity = 1.35;
          const daySunDir = backdropDirForU(BACKDROP_SUN_U.day);
          const daySunH = Math.hypot(16, 14);
          sunLight.position.set(daySunDir.x * daySunH, 26, daySunDir.z * daySunH);
          waterUniforms.uSkyColor.value.setHex(0x7dd3fc);
          waterUniforms.uDeepColor.value.setHex(0x0d444d);
          waterUniforms.uSunColor.value.setHex(0xfff6e5);
          bedUniforms.uCausticIntensity.value = 0.55;
          bedUniforms.uCausticColor.value.setHex(0x99f6e4);
          lanternLight.intensity = 0.5;
          pondGlowLight.intensity = 0.7;
          koiEmissive = 0.04;
          finEmissive = 0.02;
        } else if (validMode === 'sunset') {
          scene.background.setHex(0x664e78);
          scene.fog.color.setHex(0x473e2e);
          plateGrassHex = 0x473e2e;
          bedGrassHex = 0x6c683a;
          hemiLight.color.setHex(0xfdba74);
          hemiLight.groundColor.setHex(0x3a2d24);
          hemiLight.intensity = 0.7;
          sunLight.color.setHex(0xff7e33);
          sunLight.intensity = 1.55;
          const sunsetSunDir = backdropDirForU(BACKDROP_SUN_U.sunset);
          const sunsetSunH = Math.hypot(-22, -14);
          sunLight.position.set(sunsetSunDir.x * sunsetSunH, 11, sunsetSunDir.z * sunsetSunH);
          waterUniforms.uSkyColor.value.setHex(0xfb923c);
          waterUniforms.uDeepColor.value.setHex(0x1c2d3f);
          waterUniforms.uSunColor.value.setHex(0xffedd5);
          bedUniforms.uCausticIntensity.value = 0.48;
          bedUniforms.uCausticColor.value.setHex(0xfdba74);
          lanternLight.intensity = 1.6;
          pondGlowLight.intensity = 0.85;
          koiEmissive = 0.1;
          finEmissive = 0.06;
        } else if (validMode === 'night') {
          // KOI_VIS_V3: Raised night hemisphere/moonlight + underwater fill + gentle koi emissive so koi stay clearly readable at night
          scene.background.setHex(0x142543);
          scene.fog.color.setHex(0x363f35);
          plateGrassHex = 0x363f35;
          // Warm-olive compensated base grass so cyan night lights (0x7dd3fc / 0xbae6fd) light the bank toward #425c3f instead of teal
          bedGrassHex = 0x465d28;
          hemiLight.color.setHex(0x7dd3fc);
          hemiLight.groundColor.setHex(0x1a332d);
          hemiLight.intensity = 0.62;
          sunLight.color.setHex(0xbae6fd);
          sunLight.intensity = 0.72;
          const nightMoonDir = backdropDirForU(BACKDROP_SUN_U.night);
          const nightMoonH = Math.hypot(10, -12);
          sunLight.position.set(nightMoonDir.x * nightMoonH, 24, nightMoonDir.z * nightMoonH);
          waterUniforms.uSkyColor.value.setHex(0x1e3a8a);
          waterUniforms.uDeepColor.value.setHex(0x082c36);
          waterUniforms.uSunColor.value.setHex(0xbae6fd);
          bedUniforms.uCausticIntensity.value = 0.42;
          bedUniforms.uCausticColor.value.setHex(0x38bdf8);
          lanternLight.intensity = 2.8;
          pondGlowLight.intensity = 1.65;
          koiEmissive = 0.28;
          finEmissive = 0.18;
        }
        for (let i = 0; i < koiList.length; i++) {
          if (koiList[i].bodyMat) koiList[i].bodyMat.emissiveIntensity = koiEmissive;
          if (koiList[i].finMat) koiList[i].finMat.emissiveIntensity = finEmissive;
        }
        updateGroundGrassColor(plateGrassHex, bedGrassHex);
        syncBackdropToAmbiance(validMode);
        waterUniforms.uSunDir.value.copy(sunLight.position).normalize();
      }

      modeButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          applyAmbianceMode(btn.getAttribute('data-mode'));
        });
      });

      (function initDefaultTimeOfDay() {
        const todParam = new URLSearchParams(location.search).get('tod');
        if (todParam === 'day' || todParam === 'sunset' || todParam === 'night') {
          applyAmbianceMode(todParam);
          return;
        }
        const now = new Date();
        const totalMinutes = now.getHours() * 60 + now.getMinutes();
        // 05:00–06:59 (300–419) and 17:00–18:59 (1020–1139) -> 'sunset' (Golden)
        // 07:00–16:59 (420–1019) -> 'day'
        // 19:00–04:59 (>=1140 or <300) -> 'night' (Lantern)
        let autoMode = 'night';
        if ((totalMinutes >= 300 && totalMinutes < 420) || (totalMinutes >= 1020 && totalMinutes < 1140)) {
          autoMode = 'sunset';
        } else if (totalMinutes >= 420 && totalMinutes < 1020) {
          autoMode = 'day';
        }
        applyAmbianceMode(autoMode);
      })();

      // KOI_VIS_V3 & CAM_CYCLE_V2: Front-facing oblique view from out over the pond / far side looking back toward 小团 and down onto the water.
      // Hard constraint: let H = horizontal (camPos - P) normalized; require dot(H, F) >= cos(55°) so 小团 faces the viewer (face, eyes, smile visible).
      // Searches candidate camera positions/targets with a temporary PerspectiveCamera so 小团 (incl. +1.2 above head),
      // the food landing centre (spotInFront), the pond centre (0,-0.3,0) and 4 points at radius 4 around the pond centre
      // project inside NDC safe box x in [-0.9, 0.9], y in [-0.55, 0.85] with 小团 as large as possible.
      // If no candidate satisfies all points, relaxes the ring-point requirement first (keeping 小团 + landing centre + pond centre).
      function computeXiaotuanCameraView(aspect = camera.aspect) {
        xiaotuan.group.updateMatrixWorld(true);
        const P = xiaotuan.group.position.clone();
        const up = new THREE.Vector3(0, 1, 0);
        const F = new THREE.Vector3(0, 0, 1).applyQuaternion(xiaotuan.group.quaternion);
        F.y = 0;
        if (F.lengthSq() < 1e-6) F.set(0.864, 0, 0.503);
        else F.normalize();
        const R = new THREE.Vector3().crossVectors(up, F).normalize();

        const safeAspect = Math.max(0.35, Number.isFinite(aspect) && aspect > 0 ? aspect : 1.0);
        const tmpCam = new THREE.PerspectiveCamera(camera.fov, safeAspect, camera.near, camera.far);
        tmpCam.up.set(0, 1, 0);

        // 1. 小团 bbox corners (at rest baseY) including +1.2 above its head
        const savedY = xiaotuan.group.position.y;
        const savedRotY = xiaotuan.group.rotation.y;
        xiaotuan.group.position.y = xiaotuan.baseY;
        xiaotuan.group.rotation.y = xiaotuan.baseYaw;
        xiaotuan.group.updateMatrixWorld(true);
        const xtBox = new THREE.Box3().setFromObject(xiaotuan.group);
        xiaotuan.group.position.y = savedY;
        xiaotuan.group.rotation.y = savedRotY;
        xiaotuan.group.updateMatrixWorld(true);

        const xtMinX = xtBox.min.x;
        const xtMaxX = xtBox.max.x;
        const xtMinY = xtBox.min.y;
        const xtMaxY = xtBox.max.y + 1.2; // include +1.2 above head for raised arm & toss arc
        const xtMinZ = xtBox.min.z;
        const xtMaxZ = xtBox.max.z;

        const xtCorners = [
          new THREE.Vector3(xtMinX, xtMinY, xtMinZ),
          new THREE.Vector3(xtMaxX, xtMinY, xtMinZ),
          new THREE.Vector3(xtMinX, xtMaxY, xtMinZ),
          new THREE.Vector3(xtMaxX, xtMaxY, xtMinZ),
          new THREE.Vector3(xtMinX, xtMinY, xtMaxZ),
          new THREE.Vector3(xtMaxX, xtMinY, xtMaxZ),
          new THREE.Vector3(xtMinX, xtMaxY, xtMaxZ),
          new THREE.Vector3(xtMaxX, xtMaxY, xtMaxZ)
        ];

        // 2. Landing centre (centre of spotInFront region)
        let lx = P.x * 0.28;
        let lz = P.z * 0.34;
        const lm = getPondMetrics(lx, lz);
        if (lm.normDist > 0.7) {
          lx = Math.cos(lm.theta) * lm.maxR * 0.48;
          lz = Math.sin(lm.theta) * lm.maxR * 0.48;
        }
        const landingCenter = new THREE.Vector3(lx, 0.02, lz);

        // 3. Pond centre (0, -0.3, 0) and 4 ring points at radius 4 around pond centre
        const pondCenter = new THREE.Vector3(0, -0.3, 0);
        const ringPts = [
          new THREE.Vector3(4, -0.3, 0),
          new THREE.Vector3(-4, -0.3, 0),
          new THREE.Vector3(0, -0.3, 4),
          new THREE.Vector3(0, -0.3, -4)
        ];
        const corePts = [...xtCorners, landingCenter, pondCenter];
        const allPts = [...corePts, ...ringPts];

        const minD = controls.minDistance + 0.2;
        const maxD = controls.maxDistance - 0.5;
        const cos55 = Math.cos(THREE.MathUtils.degToRad(55));
        const tanHalfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
        const projTmp = new THREE.Vector3();
        const candPos = new THREE.Vector3();
        const candTarget = new THREE.Vector3();
        const dirVec = new THREE.Vector3();
        const hVec = new THREE.Vector3();

        // Helper: compute a water-level lookAt target that centers a point set inside the safe box (0, +0.15)
        function solveCenteredTarget(camPos, pts, targetDist) {
          let ux = P.x - camPos.x, uy = (P.y + 1.5) - camPos.y, uz = P.z - camPos.z;
          const ul = Math.hypot(ux, uy, uz) || 1;
          ux /= ul; uy /= ul; uz /= ul;
          let vx = pondCenter.x - camPos.x, vy = pondCenter.y - camPos.y, vz = pondCenter.z - camPos.z;
          const vl = Math.hypot(vx, vy, vz) || 1;
          vx /= vl; vy /= vl; vz /= vl;
          let mx = ux + vx, my = uy + vy, mz = uz + vz;
          const ml = Math.hypot(mx, my, mz) || 1;
          mx /= ml; my /= ml; mz /= ml;
          const out = new THREE.Vector3(
            camPos.x + mx * targetDist,
            camPos.y + my * targetDist,
            camPos.z + mz * targetDist
          );
          tmpCam.position.copy(camPos);
          for (let iter = 0; iter < 6; iter++) {
            tmpCam.lookAt(out);
            tmpCam.updateMatrixWorld(true);
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            for (let k = 0; k < pts.length; k++) {
              projTmp.copy(pts[k]).project(tmpCam);
              if (projTmp.z > 1) return out;
              minX = Math.min(minX, projTmp.x);
              maxX = Math.max(maxX, projTmp.x);
              minY = Math.min(minY, projTmp.y);
              maxY = Math.max(maxY, projTmp.y);
            }
            const cx = 0.5 * (minX + maxX);
            const cy = 0.5 * (minY + maxY) - 0.15;
            let zx = camPos.x - out.x, zy = camPos.y - out.y, zz = camPos.z - out.z;
            const zl = Math.hypot(zx, zy, zz) || 1;
            zx /= zl; zy /= zl; zz /= zl;
            let xx = zz, xy = 0, xz = -zx;
            const xl = Math.hypot(xx, xy, xz) || 1;
            xx /= xl; xy /= xl; xz /= xl;
            const yx = zy * xz - zz * xy;
            const yy = zz * xx - zx * xz;
            const yz = zx * xy - zy * xx;
            const shiftX = cx * safeAspect * tanHalfFov * targetDist * 0.85;
            const shiftY = cy * tanHalfFov * targetDist * 0.85;
            out.x += xx * shiftX + yx * shiftY;
            out.y += xy * shiftX + yy * shiftY;
            out.z += xz * shiftX + yz * shiftY;
            const dx = out.x - camPos.x, dy = out.y - camPos.y, dz = out.z - camPos.z;
            const dl = Math.hypot(dx, dy, dz) || 1;
            out.set(
              camPos.x + (dx / dl) * targetDist,
              camPos.y + (dy / dl) * targetDist,
              camPos.z + (dz / dl) * targetDist
            );
          }
          const rayY = out.y - camPos.y;
          if (rayY < -0.05) {
            const tWater = (0.1 - camPos.y) / rayY;
            const d = tWater * camPos.distanceTo(out);
            if (d >= minD && d <= maxD) {
              out.set(
                camPos.x + (out.x - camPos.x) * tWater,
                0.1,
                camPos.z + (out.z - camPos.z) * tWater
              );
            }
          }
          return out;
        }

        let bestFullPos = null;
        let bestFullTarget = null;
        let bestFullScore = -Infinity;
        let bestCorePos = null;
        let bestCoreTarget = null;
        let bestCoreScore = -Infinity;
        let fallbackPos = null;
        let fallbackTarget = null;
        let fallbackPenalty = Infinity;

        // Candidate angles within ±55° of F, distances 6–16 over the pond (plus 18–23 on the far side for narrow aspects), and heights 4–11 (>= 3 units above water)
        const angDegs = [-52, -45, -38, -32, -26, -22, -18, -14, -10, -6, -2, 2, 8, 15, 22, 28, 36, 44, 52];
        const distPs = [6.0, 7.5, 9.0, 10.5, 12.0, 13.5, 15.0, 16.0, 18.0, 20.0, 22.0, 23.0];
        const camYs = [4.0, 5.0, 6.0, 7.2, 8.5, 9.8, 11.0];
        const tLerps = [0.25, 0.4, 0.55, 0.7];
        const tRs = [-2.0, -0.8, 0.0, 0.8, 2.0];
        const tys = [-0.2, 0.1, 0.4];

        for (let ai = 0; ai < angDegs.length; ai++) {
          const ang = THREE.MathUtils.degToRad(angDegs[ai]);
          dirVec.set(
            F.x * Math.cos(ang) + R.x * Math.sin(ang),
            0,
            F.z * Math.cos(ang) + R.z * Math.sin(ang)
          ).normalize();

          for (let di = 0; di < distPs.length; di++) {
            const distP = distPs[di];
            const cx = P.x + dirVec.x * distP;
            const cz = P.z + dirVec.z * distP;

            // Hard constraint: H = horizontal (camPos - P) normalized; require dot(H, F) >= cos(55°)
            hVec.set(cx - P.x, 0, cz - P.z);
            if (hVec.lengthSq() < 1e-6) continue;
            hVec.normalize();
            if (hVec.dot(F) < cos55 - 1e-6) continue;

            // Keep camera over the pond / far side (closer to pond centre than the outer bank)
            const distToPondCenter = Math.hypot(cx - pondCenter.x, cz - pondCenter.z);
            if (distToPondCenter > 16.0) continue;

            for (let hi = 0; hi < camYs.length; hi++) {
              const camY = camYs[hi];
              if (camY < 3.0) continue; // at least ~3 units above water surface
              candPos.set(cx, camY, cz);

              const targetCandidates = [
                solveCenteredTarget(candPos, allPts, 11),
                solveCenteredTarget(candPos, corePts, 11)
              ];
              for (let ti = 0; ti < tLerps.length; ti++) {
                const tLerp = tLerps[ti];
                for (let ri = 0; ri < tRs.length; ri++) {
                  const tR = tRs[ri];
                  for (let yi = 0; yi < tys.length; yi++) {
                    targetCandidates.push(new THREE.Vector3(
                      P.x * (1 - tLerp) + pondCenter.x * tLerp + R.x * tR,
                      tys[yi],
                      P.z * (1 - tLerp) + pondCenter.z * tLerp + R.z * tR
                    ));
                  }
                }
              }

              for (let tIdx = 0; tIdx < targetCandidates.length; tIdx++) {
                candTarget.copy(targetCandidates[tIdx]);
                const dTarget = candPos.distanceTo(candTarget);
                if (dTarget < minD || dTarget > maxD) continue;

                tmpCam.position.copy(candPos);
                tmpCam.lookAt(candTarget);
                tmpCam.updateMatrixWorld(true);

                let coreInside = true;
                let corePenalty = 0;
                let minXtX = Infinity, maxXtX = -Infinity;
                let minXtY = Infinity, maxXtY = -Infinity;

                for (let k = 0; k < xtCorners.length; k++) {
                  projTmp.copy(xtCorners[k]).project(tmpCam);
                  if (projTmp.z < -1 || projTmp.z > 1) {
                    coreInside = false;
                    corePenalty = 999;
                    break;
                  }
                  const px = projTmp.x;
                  const py = projTmp.y;
                  minXtX = Math.min(minXtX, px);
                  maxXtX = Math.max(maxXtX, px);
                  minXtY = Math.min(minXtY, py);
                  maxXtY = Math.max(maxXtY, py);
                  const overX = Math.max(0, Math.abs(px) - 0.9);
                  const overY = Math.max(0, -0.55 - py, py - 0.85);
                  if (overX > 0 || overY > 0) {
                    coreInside = false;
                    corePenalty = Math.max(corePenalty, overX + overY);
                  }
                }
                if (corePenalty >= 999) continue;

                // Project landing centre and pond centre
                projTmp.copy(landingCenter).project(tmpCam);
                if (projTmp.z < -1 || projTmp.z > 1) continue;
                const landOver = Math.max(0, Math.abs(projTmp.x) - 0.9) + Math.max(0, -0.55 - projTmp.y, projTmp.y - 0.85);
                if (landOver > 0) {
                  coreInside = false;
                  corePenalty = Math.max(corePenalty, landOver);
                }

                projTmp.copy(pondCenter).project(tmpCam);
                if (projTmp.z < -1 || projTmp.z > 1) continue;
                const pondNdcY = projTmp.y;
                const pondOver = Math.max(0, Math.abs(projTmp.x) - 0.9) + Math.max(0, -0.55 - projTmp.y, projTmp.y - 0.85);
                if (pondOver > 0) {
                  coreInside = false;
                  corePenalty = Math.max(corePenalty, pondOver);
                }

                // Ensure pond with koi is in the lower/middle of the frame and 小团 sits on the bank in the upper/middle part
                const xtCenterY = 0.5 * (minXtY + maxXtY);
                if (xtCenterY <= pondNdcY + 0.15 || pondNdcY > 0.10) continue;

                // Check 4 ring points at radius 4 around pond centre
                let ringsInside = true;
                for (let k = 0; k < ringPts.length; k++) {
                  projTmp.copy(ringPts[k]).project(tmpCam);
                  if (projTmp.z < -1 || projTmp.z > 1 || Math.abs(projTmp.x) > 0.9 || projTmp.y < -0.55 || projTmp.y > 0.85) {
                    ringsInside = false;
                    break;
                  }
                }

                const xtSize = Math.max(0, maxXtX - minXtX) * Math.max(0, maxXtY - minXtY);
                if (coreInside && ringsInside) {
                  if (xtSize > bestFullScore) {
                    bestFullScore = xtSize;
                    bestFullPos = candPos.clone();
                    bestFullTarget = candTarget.clone();
                  }
                } else if (coreInside) {
                  if (xtSize > bestCoreScore) {
                    bestCoreScore = xtSize;
                    bestCorePos = candPos.clone();
                    bestCoreTarget = candTarget.clone();
                  }
                } else if (corePenalty < fallbackPenalty) {
                  fallbackPenalty = corePenalty;
                  fallbackPos = candPos.clone();
                  fallbackTarget = candTarget.clone();
                }
              }
            }
          }
        }

        const chosenPos = bestFullPos || bestCorePos || fallbackPos || new THREE.Vector3(-6.0, 11.0, 14.65);
        const chosenTarget = bestFullTarget || bestCoreTarget || fallbackTarget || new THREE.Vector3(-7.5, -0.2, 1.6);

        return {
          pos: [chosenPos.x, chosenPos.y, chosenPos.z],
          target: [chosenTarget.x, chosenTarget.y, chosenTarget.z]
        };
      }

      const initialXiaotuanView = computeXiaotuanCameraView(camera.aspect);
      const CAM_VIEWS = [
        { id: 'overview', key: 'koi.cam.overview', get label() { return I18N.t(this.key); }, pos: [7.2, 10.8, 16.0], target: [-2.6, 0.25, 0.3] },
        { id: 'xiaotuan', key: 'koi.cam.xiaotuan', get label() { return I18N.t(this.key); }, pos: initialXiaotuanView.pos, target: initialXiaotuanView.target },
        { id: 'waterfall', key: 'koi.cam.waterfall', get label() { return I18N.t(this.key); }, pos: [5.4, 7.6, 11.2], target: [PLUNGE_X * 0.45, 0.0, PLUNGE_Z * 0.45] },
        { id: 'surface', key: 'koi.cam.surface', get label() { return I18N.t(this.key); }, pos: [-8.2, 3.1, 11.0], target: [0.8, -0.35, -0.8] }
      ];
      let currentCamIndex = 0;
      const camCycleBtn = document.getElementById('cam-cycle-btn');
      const camCycleLabel = document.getElementById('cam-cycle-label');

      // KOI_VIS_V3: Expose debug hook only when URL has ?debug=1
      if (new URLSearchParams(location.search).get('debug') === '1') {
        window.__koi = {
          camera,
          controls,
          fishCount: () => koiList.length,
          views: CAM_VIEWS,
          backdrop: {
            mesh: backdropState.mesh,
            dirForU: backdropDirForU,
            sun: BACKDROP_SUN_U,
            seams: BACKDROP_SEAMS_U,
            aspect: { displayed: (2 * Math.PI * BACKDROP_R) / BACKDROP_H, image: 6144 / 1142 }
          }
        };
      }

      function applyCameraViewByIndex(idx) {
        currentCamIndex = ((idx % CAM_VIEWS.length) + CAM_VIEWS.length) % CAM_VIEWS.length;
        const v = CAM_VIEWS[currentCamIndex];
        if (v.id === 'xiaotuan') {
          const fresh = computeXiaotuanCameraView(camera.aspect);
          v.pos = fresh.pos;
          v.target = fresh.target;
        }
        if (camCycleLabel) camCycleLabel.textContent = v.label;
        flyCameraTo(v.pos, v.target);
      }

      if (camCycleBtn) {
        camCycleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          applyCameraViewByIndex(currentCamIndex + 1);
        });
      }

      // Camera Viewpoint Preset Buttons (sync cycle index when clicked)
      document.querySelectorAll('.cam-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const preset = btn.getAttribute('data-cam');
          const idx = CAM_VIEWS.findIndex((v) => v.id === preset);
          if (idx !== -1) {
            applyCameraViewByIndex(idx);
          }
        });
      });

      // Sound Toggle Button
      const audioBtn = document.getElementById('audio-btn');
      const iconSoundOn = document.getElementById('icon-sound-on');
      const iconSoundOff = document.getElementById('icon-sound-off');
      audioBtn.addEventListener('click', () => {
        const isOn = sound.toggle();
        iconSoundOn.classList.toggle('hidden', !isOn);
        iconSoundOff.classList.toggle('hidden', isOn);
        showToast(I18N.t(isOn ? 'koi.toast.soundOn' : 'koi.toast.soundOff'));
      });

      // ============================================================================
      // 14. MAIN ANIMATION LOOP (KOI AI, PHYSICS, WATER & FLORA)
      // ============================================================================
      const clock = new THREE.Clock();
      let waterfallRippleTimer = 0;

      // Helper for shortest angular difference
      function angleDiff(a, b) {
        let d = b - a;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        return d;
      }

      // Pick a new safe random wander target inside the pond
      function pickRandomWanderTarget() {
        const ang = Math.random() * Math.PI * 2;
        const maxR = getPondBoundaryRadius(ang);
        const r = (0.18 + Math.random() * 0.56) * maxR;
        return new THREE.Vector3(
          Math.cos(ang) * r,
          -0.35 - Math.random() * 0.9,
          Math.sin(ang) * r
        );
      }

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.getElapsedTime();

        // Update Shader Time Uniforms
        waterUniforms.uTime.value = elapsed;
        bedUniforms.uTime.value = elapsed;
        waterfallUniforms.uTime.value = elapsed;

        // Smooth Camera Preset Transitions
        if (camTransition) {
          camTransition.progress += dt * 1.45;
          const t = THREE.MathUtils.smoothstep(camTransition.progress, 0, 1);
          camera.position.lerpVectors(camTransition.startPos, camTransition.endPos, t);
          controls.target.lerpVectors(camTransition.startTarget, camTransition.endTarget, t);
          if (camTransition.progress >= 1) camTransition = null;
        }
        controls.update();
        updateXiaotuan(elapsed, dt);

        // 1. Update Waterfall Plunge Mist Particles & Ripples
        waterfallRippleTimer += dt;
        if (waterfallRippleTimer > 0.42) {
          waterfallRippleTimer = 0;
          spawnWaterRipple(
            PLUNGE_X + (Math.random() - 0.5) * 0.9,
            PLUNGE_Z + (Math.random() - 0.5) * 0.9,
            0.65,
            2.4
          );
        }

        const mPos = mistGeo.attributes.position;
        for (let i = 0; i < mistCount; i++) {
          const m = mistData[i];
          m.age += dt * m.speed;
          if (m.age > 1.0) m.age -= 1.0;

          const mx = PLUNGE_X + m.vx * m.age * 1.6;
          const my = 0.05 + m.vy * m.age - 0.5 * m.age * m.age;
          const mz = PLUNGE_Z + m.vz * m.age * 1.6;
          mPos.setXYZ(i, mx, my, mz);
        }
        mPos.needsUpdate = true;

        // 2. Update Floating Lily Pads, Swaying Reeds & Blossom Petals
        for (let i = 0; i < lilyPads.length; i++) {
          const pad = lilyPads[i];
          pad.group.position.y = 0.025 + Math.sin(elapsed * 1.8 + pad.phase) * 0.014;
          pad.group.rotation.x = Math.sin(elapsed * 1.3 + pad.phase) * 0.03;
          pad.group.rotation.z = Math.cos(elapsed * 1.5 + pad.phase) * 0.03;
          pad.group.rotation.y = pad.baseRotY + Math.sin(elapsed * 0.4 + pad.phase) * 0.04;
        }

        for (let i = 0; i < swayingPlants.length; i++) {
          const sp = swayingPlants[i];
          sp.obj.rotation.x = sp.baseX + Math.sin(elapsed * sp.speed + sp.phase) * sp.amp;
          sp.obj.rotation.z = sp.baseZ + Math.cos(elapsed * sp.speed * 0.85 + sp.phase) * sp.amp;
        }

        for (let i = 0; i < floatingPetals.length; i++) {
          const fp = floatingPetals[i];
          fp.angle += fp.speed * dt;
          fp.mesh.position.x = Math.cos(fp.angle) * fp.radius + Math.sin(elapsed + fp.phase) * 0.2;
          fp.mesh.position.z = Math.sin(fp.angle) * fp.radius + Math.cos(elapsed + fp.phase) * 0.2;
          fp.mesh.position.y = 0.016 + Math.sin(elapsed * 2.2 + fp.phase) * 0.012;
          fp.mesh.rotation.y += dt * 0.35;
        }

        // 3. Update Darting Dragonflies
        for (let i = 0; i < dragonflies.length; i++) {
          const df = dragonflies[i];
          // Rapid wing flutter
          const wingAngle = Math.sin(elapsed * 48 + i * 2) * 0.45;
          df.leftWing.rotation.z = wingAngle;
          df.rightWing.rotation.z = -wingAngle;

          df.waitTimer -= dt;
          if (df.waitTimer <= 0 && lilyPads.length > 0) {
            const nextPad = lilyPads[Math.floor(Math.random() * lilyPads.length)];
            df.targetPos.set(
              nextPad.x + (Math.random() - 0.5) * 1.2,
              0.32 + Math.random() * 0.55,
              nextPad.z + (Math.random() - 0.5) * 1.2
            );
            df.waitTimer = 2.8 + Math.random() * 3.5;
          }

          const toTarget = df.targetPos.clone().sub(df.group.position);
          if (toTarget.length() > 0.12) {
            df.group.position.addScaledVector(toTarget, dt * 3.2);
            const targetYaw = Math.atan2(toTarget.x, toTarget.z);
            df.group.rotation.y = targetYaw;
          } else {
            df.group.position.y += Math.sin(elapsed * 5 + i) * 0.002;
          }
        }

        // 4. Update Food Pellets (Falling Arc, Tumble Spin, Water Landing Ripples & Bobbing)
        for (let i = pellets.length - 1; i >= 0; i--) {
          const p = pellets[i];
          if (p.eaten) {
            scene.remove(p.mesh);
            pellets.splice(i, 1);
            updateFeedingHUD();
            continue;
          }

          if (!p.landed) {
            p.vy -= 9.8 * dt;
            p.mesh.position.y += p.vy * dt;
            if (p.vx != null) {
              p.mesh.position.x += p.vx * dt;
              p.mesh.position.z += p.vz * dt;
            } else {
              p.mesh.position.x = THREE.MathUtils.lerp(p.mesh.position.x, p.targetX, dt * 4);
              p.mesh.position.z = THREE.MathUtils.lerp(p.mesh.position.z, p.targetZ, dt * 4);
            }

            // Tumble / spin while airborne
            if (p.rxSpeed != null) {
              p.mesh.rotation.x += p.rxSpeed * dt;
              p.mesh.rotation.y += p.rySpeed * dt;
              p.mesh.rotation.z += p.rzSpeed * dt;
            }

            if (p.mesh.position.y <= 0.02 && p.vy < 0) {
              p.mesh.position.y = 0.02;
              p.landed = true;
              // Wrap x/z rotations into [-PI, PI] so settling flat takes the shortest angular path
              p.mesh.rotation.x = Math.atan2(Math.sin(p.mesh.rotation.x), Math.cos(p.mesh.rotation.x));
              p.mesh.rotation.z = Math.atan2(Math.sin(p.mesh.rotation.z), Math.cos(p.mesh.rotation.z));
              spawnWaterRipple(p.mesh.position.x, p.mesh.position.z, 0.9, 2.1);
              sound.playPlop((Math.random() - 0.5) * 0.6);
            }
          } else {
            // Gently bob, drift, and settle flat-ish on the water surface
            p.mesh.position.y = 0.015 + Math.sin(elapsed * 3.8 + p.bobPhase) * 0.018;
            p.mesh.position.x += Math.sin(elapsed * 0.7 + p.bobPhase) * 0.002;
            p.mesh.position.z += Math.cos(elapsed * 0.6 + p.bobPhase) * 0.002;
            const targetRx = (p.restRx || 0) + Math.sin(elapsed * 2.4 + p.bobPhase) * 0.06;
            const targetRz = (p.restRz || 0) + Math.cos(elapsed * 2.1 + p.bobPhase) * 0.06;
            p.mesh.rotation.x = THREE.MathUtils.lerp(p.mesh.rotation.x, targetRx, dt * 6.5);
            p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, targetRz, dt * 6.5);
            p.mesh.rotation.y += dt * 0.18;
          }
        }

        // 5. Update Expanding Visual Water Ripples & Splash Droplet Bursts
        for (let i = visualRipples.length - 1; i >= 0; i--) {
          const r = visualRipples[i];
          r.age += dt;
          if (r.age >= r.maxAge) {
            scene.remove(r.mesh);
            r.mesh.material.dispose();
            visualRipples.splice(i, 1);
          } else {
            const prog = r.age / r.maxAge;
            const scale = 1.0 + Math.pow(prog, 0.75) * r.maxScale * 6.0;
            r.mesh.scale.setScalar(scale);
            r.mesh.material.opacity = r.initOpacity * (1.0 - prog);
          }
        }

        for (let i = splashBursts.length - 1; i >= 0; i--) {
          const sb = splashBursts[i];
          sb.age += dt;
          if (sb.age > 0.65) {
            scene.remove(sb.group);
            sb.mat.dispose();
            splashBursts.splice(i, 1);
          } else {
            sb.mat.opacity = 1.0 - sb.age / 0.65;
            for (let d of sb.drops) {
              d.vy -= 9.5 * dt;
              d.mesh.position.x += d.vx * dt;
              d.mesh.position.y += d.vy * dt;
              d.mesh.position.z += d.vz * dt;
            }
          }
        }

        // 6. Update All 16 Living Koi Fish (Active Feeding AI, Steering, Undulation & Shadows)
        // Count how many fish are targeting each pellet to distribute targets naturally
        const pelletClaimCount = new Map();

        for (let i = 0; i < koiList.length; i++) {
          const fish = koiList[i];
          const pos = fish.group.position;

          // Determine if floating food pellets are available
          let chosenPellet = null;
          let bestScore = Infinity;

          for (let p of pellets) {
            if (p.eaten) continue;
            const dx = p.mesh.position.x - pos.x;
            const dz = p.mesh.position.z - pos.z;
            const dist = Math.hypot(dx, dz);
            const claims = pelletClaimCount.get(p) || 0;
            // Score combines distance + slight penalty for already heavily crowded pellets
            const score = dist + claims * 1.85;
            if (score < bestScore) {
              bestScore = score;
              chosenPellet = p;
            }
          }

          let targetPos;
          let desiredSpeed;
          let maxTurnRate;

          if (chosenPellet) {
            fish.state = 'feeding';
            fish.targetPellet = chosenPellet;
            pelletClaimCount.set(chosenPellet, (pelletClaimCount.get(chosenPellet) || 0) + 1);

            targetPos = chosenPellet.mesh.position;
            // Hungry acceleration!
            desiredSpeed = fish.baseCruiseSpeed * 2.45;
            maxTurnRate = 4.2;

            // Check if the koi's mouth (at front of head) has reached the pellet!
            const mouthX = pos.x + Math.sin(fish.heading) * (0.78 * fish.scale);
            const mouthZ = pos.z + Math.cos(fish.heading) * (0.78 * fish.scale);
            const distToMouth = Math.hypot(
              chosenPellet.mesh.position.x - mouthX,
              chosenPellet.mesh.position.z - mouthZ
            );

            if (chosenPellet.landed && distToMouth < 0.52 * fish.scale && pos.y > -0.45) {
              // Gulp the pellet!
              chosenPellet.eaten = true;
              totalPelletsEaten++;
              spawnWaterRipple(chosenPellet.mesh.position.x, chosenPellet.mesh.position.z, 1.35, 3.0);
              spawnGulpSplash(chosenPellet.mesh.position.x, chosenPellet.mesh.position.z);
              sound.playPlop(0.5);
              if (totalPelletsEaten % 4 === 0) {
                const pentatonic = [523.25, 587.33, 659.25, 783.99, 880.0];
                sound.playChime(pentatonic[totalPelletsEaten % pentatonic.length], 0.035);
              }
              updateFeedingHUD();
              // Pick a celebratory dive target after eating
              fish.wanderTarget = pickRandomWanderTarget();
              fish.wanderTimer = 3.0;
            }
          } else {
            fish.state = 'cruising';
            fish.targetPellet = null;
            desiredSpeed = fish.baseCruiseSpeed;
            maxTurnRate = 1.85;

            fish.wanderTimer -= dt;
            const distToWander = Math.hypot(fish.wanderTarget.x - pos.x, fish.wanderTarget.z - pos.z);
            if (fish.wanderTimer <= 0 || distToWander < 1.5) {
              fish.wanderTarget = pickRandomWanderTarget();
              fish.wanderTimer = 4.0 + Math.random() * 5.0;
            }
            targetPos = fish.wanderTarget;
          }

          // Smoothly adjust swimming speed
          fish.speed = THREE.MathUtils.lerp(fish.speed, desiredSpeed, dt * 3.5);

          // Compute steering vector toward target + soft avoidance of pond walls & other koi
          let steerX = targetPos.x - pos.x;
          let steerZ = targetPos.z - pos.z;
          const len = Math.hypot(steerX, steerZ) || 1;
          steerX /= len;
          steerZ /= len;

          // Shoreline boundary avoidance force so koi stay gracefully inside the pond
          const { theta, normDist } = getPondMetrics(pos.x, pos.z);
          if (normDist > 0.72) {
            const pushInward = Math.pow((normDist - 0.72) / 0.25, 1.5) * 3.8;
            steerX -= Math.cos(theta) * pushInward;
            steerZ -= Math.sin(theta) * pushInward;
          }

          // Gentle neighbor separation so koi don't overlap each other's bodies
          for (let j = 0; j < koiList.length; j++) {
            if (i === j) continue;
            const other = koiList[j].group.position;
            const dx = pos.x - other.x;
            const dz = pos.z - other.z;
            const dy = Math.abs(pos.y - other.y);
            const d = Math.hypot(dx, dz);
            const minSep = fish.state === 'feeding' ? 0.65 : 1.25;
            if (d < minSep && d > 0.001 && dy < 0.45) {
              const repulse = ((minSep - d) / minSep) * (fish.state === 'feeding' ? 0.9 : 1.6);
              steerX += (dx / d) * repulse;
              steerZ += (dz / d) * repulse;
            }
          }

          const desiredHeading = Math.atan2(steerX, steerZ);
          const diff = angleDiff(fish.heading, desiredHeading);
          const turnStep = THREE.MathUtils.clamp(diff, -maxTurnRate * dt, maxTurnRate * dt);
          fish.heading += turnStep;

          // Subtle banking roll into turns
          const targetRoll = THREE.MathUtils.clamp(-diff * 0.28, -0.32, 0.32);
          fish.roll = THREE.MathUtils.lerp(fish.roll, targetRoll, dt * 5.0);

          // Vertical depth & pitch control (ascend to surface when feeding!)
          let targetY = fish.cruiseDepth + Math.sin(elapsed * 0.9 + fish.id) * 0.08;
          if (fish.state === 'feeding' && chosenPellet) {
            const distToFood = Math.hypot(chosenPellet.mesh.position.x - pos.x, chosenPellet.mesh.position.z - pos.z);
            if (distToFood < 4.8) {
              targetY = -0.09; // Rise right up to the waterline
            } else {
              targetY = -0.22;
            }
          }

          // Ensure fish stays safely above the sculpted pond floor
          const floorY = getPondBedHeight(pos.x, pos.z);
          targetY = Math.max(targetY, floorY + 0.35);

          const dy = targetY - pos.y;
          pos.y += dy * dt * (fish.state === 'feeding' ? 3.6 : 1.8);

          // Pitch nose upward when ascending to gulp food or downward when diving
          const targetPitch = THREE.MathUtils.clamp(-dy * 0.85, -0.42, 0.35);
          fish.pitch = THREE.MathUtils.lerp(fish.pitch, targetPitch, dt * 5.0);

          // Advance forward along heading
          pos.x += Math.sin(fish.heading) * fish.speed * dt;
          pos.z += Math.cos(fish.heading) * fish.speed * dt;

          // Hard safety clamp inside pond water
          const afterMetrics = getPondMetrics(pos.x, pos.z);
          if (afterMetrics.normDist > 0.86) {
            pos.x = Math.cos(afterMetrics.theta) * (afterMetrics.maxR * 0.85);
            pos.z = Math.sin(afterMetrics.theta) * (afterMetrics.maxR * 0.85);
          }

          // Apply orientation to Koi group
          fish.group.rotation.order = 'YXZ';
          fish.group.rotation.y = fish.heading;
          fish.group.rotation.x = fish.pitch;
          fish.group.rotation.z = fish.roll;

          // Advance S-curve spine undulation phase proportional to velocity!
          fish.swimPhase += dt * (4.2 + fish.speed * 5.2);
          fish.uniforms.uSwimPhase.value = fish.swimPhase;
          fish.uniforms.uBendAmp.value = fish.state === 'feeding' ? 0.19 : 0.135;

          // Flutter pectoral fins
          const pecWave = Math.sin(fish.swimPhase * 0.85) * 0.22;
          fish.leftPec.rotation.z = -0.25 + pecWave;
          fish.rightPec.rotation.z = 0.25 - pecWave;

          // Spawn occasional gentle surface ripple when koi swims right near the top
          fish.rippleCooldown -= dt;
          if (pos.y > -0.18 && fish.rippleCooldown <= 0) {
            spawnWaterRipple(pos.x, pos.z, 0.45, 1.6);
            fish.rippleCooldown = 0.65 + Math.random() * 0.6;
          }

          // Update projected soft drop shadow on the pond bed below the fish
          const currentFloorY = getPondBedHeight(pos.x, pos.z);
          fish.shadowMesh.position.set(pos.x, currentFloorY + 0.03, pos.z);
          fish.shadowMesh.rotation.y = fish.heading;
          const heightAboveFloor = Math.max(0.1, pos.y - currentFloorY);
          fish.shadowMesh.material.opacity = THREE.MathUtils.clamp(
            0.55 - heightAboveFloor * 0.12,
            0.12,
            0.52
          );
        }

        renderer.render(scene, camera);

        // KOI_LOADING_V3: Fade out loading overlay after first rendered frame and notify parent iframe host
        if (!window.__koiFirstFrame) {
          window.__koiFirstFrame = true;
          if (window.__koiLoadTimer) {
            clearTimeout(window.__koiLoadTimer);
            window.__koiLoadTimer = null;
          }
          const loaderEl = document.getElementById('koi-loading');
          if (loaderEl) {
            loaderEl.classList.add('hide');
            setTimeout(() => {
              if (loaderEl.parentNode) loaderEl.parentNode.removeChild(loaderEl);
            }, 450);
          }
          if (EMBED) {
            try {
              parent.postMessage({ type: 'koi-ready' }, location.origin);
            } catch (e) {}
          }
          setTimeout(startBackdropLazyLoad, 0);
        }
      }

      // Responsive Window & Iframe Resize Handler
      function handleResize() {
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || window.innerHeight;
        if (!w || !h) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        const activeView = CAM_VIEWS[currentCamIndex];
        if (activeView && activeView.id === 'xiaotuan') {
          const fresh = computeXiaotuanCameraView(camera.aspect);
          activeView.pos = fresh.pos;
          activeView.target = fresh.target;
          if (camTransition) {
            camTransition.endPos.set(...fresh.pos);
            camTransition.endTarget.set(...fresh.target);
          } else {
            camera.position.set(...fresh.pos);
            controls.target.set(...fresh.target);
            controls.update();
          }
        }
      }

      window.addEventListener('resize', handleResize);
      if (typeof ResizeObserver !== 'undefined') {
        try {
          new ResizeObserver(handleResize).observe(container);
        } catch (e) {}
      }
      window.addEventListener('message', (e) => {
        if (e.origin === location.origin && e.data && e.data.type === 'pond-resize') {
          handleResize();
        }
      });
      window.addEventListener('storage', (e) => {
        if (!e.key || e.key === SAVE_KEY) refreshFoodUI();
      });

      if (typeof I18N !== 'undefined' && I18N.onChange) {
        I18N.onChange(function () {
          updateFeedingHUD();
          refreshFoodUI();
          if (camCycleLabel) camCycleLabel.textContent = CAM_VIEWS[currentCamIndex].label;
          const noFoodTextEl = document.getElementById('no-food-text');
          if (noFoodTextEl) noFoodTextEl.textContent = I18N.t('koi.noFood');
          const shopLinkEl = document.getElementById('shop-link');
          if (shopLinkEl) shopLinkEl.textContent = I18N.t('koi.goShop');
          document.title = I18N.t('koi.title');
        });
      }

      // Initial script-rendered text sync
      updateFeedingHUD();
      if (camCycleLabel) camCycleLabel.textContent = CAM_VIEWS[currentCamIndex].label;

      // Start the living pond simulation
      animate();
    })();
  </script>
</body>
</html>
