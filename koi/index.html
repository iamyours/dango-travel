<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <script src="../assets/i18n/i18n.js"></script><script src="../assets/i18n/zh.js"></script><script src="../assets/i18n/en.js"></script>
  <title data-i18n="koi.title">小团的池塘</title>
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
  <!-- KOI_LOADING_V3 -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="dns-prefetch" href="//cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b191e;
      font-family: 'Inter', sans-serif;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    .serif-jp {
      font-family: 'Noto Serif JP', serif;
    }
    .glass-panel {
      background: rgba(12, 25, 30, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5);
    }
    .feed-btn {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 50%, #dc2626 100%);
      box-shadow: 0 8px 25px -4px rgba(234, 88, 12, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .feed-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 12px 30px -4px rgba(234, 88, 12, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }
    .feed-btn:active {
      transform: translateY(1px) scale(0.97);
    }
    .feed-btn:disabled,
    .feed-btn:disabled:hover,
    .feed-btn:disabled:active {
      background: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(0.35);
      opacity: 0.72;
    }
    .food-chip {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .food-chip.on {
      border-color: rgba(251, 191, 36, 0.85);
      background: rgba(251, 191, 36, 0.22);
      color: #fde68a;
    }
    html.embed .koi-chrome,
    html.embed .koi-back,
    html.embed .koi-legend { display: none !important; }
    #no-food-msg.hidden { display: none !important; }
    /* Phone portrait, and any short landscape: keep the water clear. */
    #food-tray:empty { display: none !important; }
    @media (max-width: 760px), (max-height: 520px) {
      .koi-chrome {
        flex-direction: row !important;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 0 max(56px, env(safe-area-inset-left)) !important;
      }
      .koi-emblem, .koi-sub, #behavior-badge, .koi-lbl, .cam-presets { display: none !important; }
      .koi-brand { padding: 6px 8px !important; gap: 0; min-width: 0; }
      .koi-chrome h1 { font-size: 15px; white-space: nowrap; }
      .koi-tools { flex-wrap: nowrap; margin-left: auto; gap: 4px; }
      .koi-stats { gap: 6px; padding: 6px 8px !important; }
      .koi-modes .mode-btn { min-width: 40px; min-height: 40px; padding: 6px; justify-content: center; }
      #audio-btn { min-width: 40px; min-height: 40px; display: flex; align-items: center; justify-content: center; }
      .koi-back {
        top: max(6px, env(safe-area-inset-top)) !important;
        bottom: auto !important;
        left: max(6px, env(safe-area-inset-left)) !important;
        width: 44px;
        height: 44px;
        padding: 0 !important;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .back-label { display: none; }
      .koi-dock {
        bottom: max(6px, env(safe-area-inset-bottom)) !important;
        left: max(6px, env(safe-area-inset-left)) !important;
        right: max(6px, env(safe-area-inset-right)) !important;
        transform: none !important;
        width: auto !important;
        max-width: none !important;
        flex-direction: row !important;
        align-items: center;
        gap: 6px;
        padding: 0 !important;
      }
      #toast-banner {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 6px);
        transform: translateX(-50%);
        max-width: min(92vw, 420px);
        white-space: normal;
        text-align: center;
      }
      #food-tray {
        flex: 1 1 auto;
        flex-wrap: nowrap !important;
        overflow-x: auto;
        justify-content: flex-start;
        min-width: 0;
        max-width: none;
        padding: 4px !important;
        gap: 6px;
      }
      .food-chip {
        min-height: 44px;
        padding: 0 12px;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
      }
      #feed-koi-btn { min-height: 44px; min-width: 44px; padding: 8px 14px; flex: 0 0 auto; }
      #cam-cycle-btn { min-height: 44px; min-width: 44px; padding: 8px 12px; flex: 0 0 auto; }
      .koi-main-bar { flex: 0 0 auto; }
      #no-food-msg:not(.hidden) {
        display: flex !important;
        align-items: center;
        flex: 1 1 auto;
        min-height: 44px;
        margin: 0;
        text-align: left;
      }
    }
    #cam-cycle-btn {
      opacity: 1 !important;
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.34);
    }
    #cam-cycle-btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }
    #cam-cycle-btn .cam-cycle-ico {
      opacity: 1 !important;
      filter: brightness(1.35) saturate(1.2) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
    }
    @media (max-width: 359px) {
      .cam-cycle-lbl { display: none; }
    }
    /* i18n: keep the phone top bar on one row (brand + 中/EN switcher + stats) and the dock inside the screen in English */
    @media (max-width: 760px), (max-height: 520px) {
      .koi-brand [data-i18n-switch] { display: none; }
      .koi-lang-m { display: block !important; }
      html[data-lang="en"] .koi-chrome h1 { font-size: 13px; letter-spacing: 0; }
      html[data-lang="en"] #feed-count { display: none; }
      html[data-lang="en"] #no-food-msg:not(.hidden) { font-size: 11px; line-height: 1.25; }
    }
    @media (max-width: 400px) {
      html[data-lang="en"] .cam-cycle-lbl { display: none; }
    }
    @media (max-width: 380px) {
      .cam-cycle-lbl { display: none; }
    }
    .koi-lang-m { display: none; position: fixed; z-index: 21; top: calc(max(6px, env(safe-area-inset-top)) + 50px); left: max(6px, env(safe-area-inset-left)); }
    .koi-lang-m .i18n-switch { padding: 4px 8px; font-size: 12px; }
    html.embed .koi-lang-m { display: none !important; }
    /* Inside the game scene the iframe is short, so the dock is always a single edge bar. */
    html.embed .koi-dock {
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      transform: none !important;
      width: auto !important;
      max-width: none !important;
      flex-direction: row !important;
      align-items: center;
      gap: 6px;
      padding: 4px 6px max(4px, env(safe-area-inset-bottom)) !important;
    }
    html.embed #toast-banner {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      transform: translateX(-50%);
      max-width: 92%;
      white-space: normal;
      text-align: center;
    }
    html.embed #food-tray {
      flex: 1 1 auto;
      flex-wrap: nowrap !important;
      overflow-x: auto;
      justify-content: flex-start;
      min-width: 0;
      max-width: none;
      padding: 4px !important;
    }
    html.embed .food-chip {
      min-height: 44px;
      padding: 0 12px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
    }
    html.embed .koi-main-bar { flex: 0 0 auto; }
    html.embed #feed-koi-btn { min-height: 44px; min-width: 44px; padding: 8px 12px; flex: 0 0 auto; }
    html.embed #cam-cycle-btn { min-height: 44px; min-width: 44px; padding: 8px 10px; flex: 0 0 auto; }
    html.embed #feed-count { display: none; }
    html.embed #no-food-msg:not(.hidden) {
      display: flex !important;
      align-items: center;
      flex: 1;
      min-height: 44px;
      margin: 0;
    }
    .mode-btn {
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(251, 191, 36, 0.7);
      color: #fde68a;
      box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      70% { transform: scale(1.15); opacity: 0; }
      100% { transform: scale(1.15); opacity: 0; }
    }
    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      border: 2px solid #fb923c;
      animation: pulse-ring 2.2s infinite;
      pointer-events: none;
    }
    /* KOI_LOADING_V3 */
    #koi-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #fbf4e2;
      color: #3a2e24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      transition: opacity 0.4s ease;
    }
    #koi-loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    #koi-loading .kl-card {
      background: #fffaf0;
      border: 2px solid #3a2e24;
      border-radius: 18px;
      padding: 18px 28px;
      box-shadow: 0 4px 0 #3a2e24;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      max-width: 88vw;
    }
    #koi-loading .kl-blob {
      width: 52px;
      height: 42px;
      background: #f6e2c4;
      border: 2.5px solid #3a2e24;
      border-radius: 50% 50% 45% 45%;
      position: relative;
      animation: kl-bounce 0.85s ease-in-out infinite;
    }
    #koi-loading .kl-blob::before,
    #koi-loading .kl-blob::after {
      content: '';
      position: absolute;
      top: 15px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #3a2e24;
    }
    #koi-loading .kl-blob::before { left: 13px; }
    #koi-loading .kl-blob::after { right: 13px; }
    #koi-loading .kl-clover {
      font-size: 20px;
      line-height: 1;
      margin-bottom: -6px;
      animation: kl-spin 2.2s ease-in-out infinite;
    }
    #koi-loading-text {
      font-weight: 700;
      font-size: 15px;
      color: #3a2e24;
    }
    #koi-loading-sub {
      display: none;
      font-size: 12px;
      color: #7a6a58;
      margin-top: 2px;
    }
    @keyframes kl-bounce {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      50% { transform: translateY(-8px) scale(0.96, 1.05); }
    }
    @keyframes kl-spin {
      0%, 100% { transform: rotate(-12deg); }
      50% { transform: rotate(14deg); }
    }
  </style>
</head>
<body class="text-slate-100 antialiased">

  <!-- KOI_LOADING_V3: Full-screen loading overlay painted before scripts -->
  <div id="koi-loading" role="status" aria-live="polite">
    <div class="kl-card">
      <div class="kl-clover">🍀</div>
      <div class="kl-blob"></div>
      <div id="koi-loading-text" data-i18n="koi.loading.text">池塘加载中…</div>
      <div id="koi-loading-sub"></div>
    </div>
  </div>
  <script>
    window.__koiFirstFrame = false;
    window.__koiLoadTimer = setTimeout(function () {
      if (!window.__koiFirstFrame) {
        var t = document.getElementById('koi-loading-text');
        var s = document.getElementById('koi-loading-sub');
        if (t) t.textContent = (typeof THREE === 'undefined') ? I18N.t('koi.loading.failed') : I18N.t('koi.loading.slow');
        if (s) {
          s.textContent = I18N.t('koi.loading.hint');
          s.style.display = 'block';
        }
      }
    }, 12000);
  </script>

  <!-- 3D Viewport Container -->
  <div id="canvas-container"></div>

  <!-- Top Header & Live Stats Overlay -->
  <div class="koi-chrome fixed top-0 left-0 right-0 z-10 pointer-events-none p-3 sm:p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
    
    <!-- Brand / Title Card -->
    <div class="koi-brand glass-panel rounded-2xl px-4 py-3 pointer-events-auto flex items-center gap-3.5">
      <div class="koi-emblem w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500/30 to-red-600/30 border border-orange-400/40 flex items-center justify-center shadow-inner">
        <!-- SVG Koi Emblem -->
        <svg class="w-6 h-6 text-orange-400" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.5 3.5c-2.8 0-5.8 1.2-8.2 3.3-1.4-0.3-3.1-0.2-4.6 0.6 0.6 0.8 1 1.7 1.1 2.7-1.6 1.8-2.7 4-3.1 6.3-1.7 0.7-3.5 0.6-5.2-0.2 0.6 2.1 2.4 3.4 4.5 3.6 0.2 1.8 1.2 3.4 2.8 4.2-0.5-1.6-0.4-3.3 0.4-4.8 2.3-0.4 4.5-1.5 6.3-3.1 1 0.1 1.9 0.5 2.7 1.1 0.8-1.5 0.9-3.2 0.6-4.6 2.1-2.4 3.3-5.4 3.3-8.2 0-0.5-0.1-0.9-0.6-0.9z"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="serif-jp font-bold text-base sm:text-lg tracking-wide text-white" data-i18n="koi.title">小团的池塘</h1>
          <span id="behavior-badge" class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-400/30" data-i18n="koi.badge.cruise">
            悠闲游动
          </span>
          <span data-i18n-switch="rounded-full px-2 py-0.5 text-[11px] bg-white/15 border border-white/30 text-white"></span>
        </div>
        <p class="koi-sub text-xs text-slate-300/80 hidden sm:block" data-i18n-html="koi.sub">
          Koi Pond · 拖动环绕 · 滚轮缩放 · <span class="text-amber-300 font-medium">用商店里的食物投喂</span>
        </p>
      </div>
    </div>

    <!-- Live Telemetry & Ambiance Switcher -->
    <div class="koi-tools flex flex-wrap items-center gap-2 sm:gap-3 pointer-events-auto">
      <!-- Live Counters -->
      <div class="koi-stats glass-panel rounded-2xl px-3.5 py-2 flex items-center gap-4 text-xs sm:text-sm">
        <div class="flex items-center gap-1.5" title="池中锦鲤品系" data-i18n-attr="title:koi.stat.koiTitle">
          <span class="w-2 h-2 rounded-full bg-orange-400 animate-pulse"></span>
          <span class="koi-lbl text-slate-400" data-i18n="koi.stat.koi">锦鲤:</span>
          <span id="stat-koi" class="font-semibold text-white">16</span>
        </div>
        <div class="h-3.5 w-px bg-white/15"></div>
        <div class="flex items-center gap-1.5" title="水面饵料" data-i18n-attr="title:koi.stat.floatingTitle">
          <span class="w-2 h-2 rounded-full bg-amber-300"></span>
          <span class="koi-lbl text-slate-400" data-i18n="koi.stat.floating">漂浮:</span>
          <span id="stat-pellets" class="font-semibold text-amber-300">0</span>
        </div>
        <div class="h-3.5 w-px bg-white/15"></div>
        <div class="flex items-center gap-1.5" title="累计吃掉" data-i18n-attr="title:koi.stat.fedTitle">
          <span class="koi-lbl text-slate-400" data-i18n="koi.stat.fed">已喂:</span>
          <span id="stat-eaten" class="font-semibold text-emerald-300">0</span>
        </div>
      </div>

      <!-- Lighting / Time of Day Switcher -->
      <div class="koi-modes glass-panel rounded-2xl p-1 flex items-center gap-1 text-xs">
        <button data-mode="day" class="mode-btn active px-2.5 py-1.5 rounded-xl border border-transparent font-medium flex items-center gap-1 text-slate-200 hover:text-white">
          <span>☀️</span><span class="hidden sm:inline" data-i18n="koi.mode.day">白天</span>
        </button>
        <button data-mode="sunset" class="mode-btn px-2.5 py-1.5 rounded-xl border border-transparent font-medium flex items-center gap-1 text-slate-200 hover:text-white">
          <span>🌅</span><span class="hidden sm:inline" data-i18n="koi.mode.sunset">黄昏</span>
        </button>
        <button data-mode="night" class="mode-btn px-2.5 py-1.5 rounded-xl border border-transparent font-medium flex items-center gap-1 text-slate-200 hover:text-white">
          <span>🏮</span><span class="hidden sm:inline" data-i18n="koi.mode.night">灯笼</span>
        </button>
      </div>

      <!-- Sound Toggle -->
      <button id="audio-btn" class="glass-panel rounded-2xl p-2.5 text-slate-300 hover:text-white transition" title="开关流水与投喂音效" data-i18n-attr="title:koi.audio.title;aria-label:koi.audio.title">
        <svg id="icon-sound-on" class="w-4 h-4 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
        </svg>
        <svg id="icon-sound-off" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Bottom Control Bar -->
  <div class="koi-dock fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-10 pointer-events-none flex flex-col items-center gap-2.5 w-full max-w-xl px-4">
    
    <!-- Toast / Event Feed Notification -->
    <div id="toast-banner" class="glass-panel rounded-full px-4 py-1.5 text-xs text-amber-200/95 opacity-0 transition-opacity duration-300 pointer-events-none flex items-center justify-center gap-2">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping flex-shrink-0"></span>
      <span id="toast-text" data-i18n="koi.toast.initial">将浮水饲料撒入池塘中！</span>
    </div>

    <div id="food-tray" class="glass-panel rounded-2xl px-3 py-2 pointer-events-auto flex flex-wrap gap-1.5 justify-center max-w-xl"></div>
    <p id="no-food-msg" class="hidden glass-panel rounded-full px-4 py-1.5 text-xs text-amber-100 pointer-events-auto">
      <span id="no-food-text" data-i18n="koi.noFood">食物不够啦，去商店买一点吧</span>
      <a id="shop-link" href="../?tab=shop" class="underline decoration-amber-200 font-semibold ml-1 whitespace-nowrap" data-i18n="koi.goShop">去商店</a>
    </p>

    <!-- Main Interactive Controls -->
    <div class="koi-main-bar glass-panel rounded-full p-2 px-3 pointer-events-auto flex items-center gap-2 sm:gap-3">
      
      <!-- Camera View Presets -->
      <div class="cam-presets hidden sm:flex items-center gap-1 pr-1 border-r border-white/15">
        <button data-cam="overview" class="cam-btn px-3 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 transition" data-i18n="koi.cam.overview">
          全景
        </button>
        <button data-cam="waterfall" class="cam-btn px-3 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 transition" data-i18n="koi.cam.waterfall">
          瀑布
        </button>
        <button data-cam="surface" class="cam-btn px-3 py-1.5 rounded-full text-xs font-medium text-slate-300 hover:text-white hover:bg-white/10 transition" data-i18n="koi.cam.waterline">
          水面
        </button>

  <div class="koi-legend fixed bottom-20 left-5 z-10 hidden xl:block pointer-events-auto">
    <div class="glass-panel rounded-2xl p-3.5 w-60 text-xs space-y-2">
      <div class="font-semibold text-slate-200 flex items-center justify-between">

        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-white to-red-500 border border-white/30"></span><span data-i18n="koi.variety.kohaku">红白</span></div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-red-500 via-white to-zinc-900 border border-white/30"></span><span data-i18n="koi.variety.sanke">大正三色</span></div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-zinc-900 via-red-600 to-white border border-white/30"></span><span data-i18n="koi.variety.showa">昭和三色</span></div>
        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 border border-white/30"></span><span data-i18n="koi.variety.yamabuki">山吹黄金</span></div>

        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-white border-2 border-red-500"></span><span data-i18n="koi.variety.tancho">丹顶</span></div>
        <div class="flex items-center gap-1.5 col-span-2"><span class="w-2.5 h-2.5 rounded-full bg-gradient-to-r from-sky-700 to-orange-500 border border-white/30"></span><span data-i18n="koi.variety.asagi">浅黄</span></div>
