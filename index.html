function curAct(t=Date.now()){if(dbgAct&&ACTS[dbgAct])return dbgAct;const h=hourAt(t),d=dayNum(sh(t).day),half=Math.floor(h*2);

function step(dt,t){ // dt game-ms, t = simulated wall time
 const day=sh(t).day;if(S.lastDay&&S.lastDay!=day)finalizeDay(S.lastDay);S.lastDay=day;

 const tr=S.trip;
 if(tr&&tr.phase=='packed'){tr.leaveIn-=dt;const h=hourAt(t);if(tr.leaveIn<=0&&h>=6&&h<21&&!S.vis.cur)departNow(t)}
 else if(tr&&tr.phase=='away'){tr.remain-=dt;if(tr.remain<=0)comeHome(t)}
 const V=S.vis;
 if(V.cur){V.cur.left-=dt;if(V.cur.left<=0)visitorLeaves(t)}
 else if(home()){V.next-=dt;const h=hourAt(t);if(V.next<=0&&h>=7&&h<21)visitorComes(t)}}

function chooseDest(food,charm,t){const forced=Q.get('place');if(forced&&PLACES.some(p=>p.id==forced))return forced;const s=seasonAt(t),f=FOODS.find(x=>x.id==food)||FOODS[0];const tags=[...f.tags];if(charm=='acorn')tags.push('forest');if(charm=='shell')tags.push('far');
 const pool=PLACES.filter(p=>!p.season||p.season==s).map(p=>{let w=p.w||{1:10,2:4,3:1.2}[p.r];for(const g of tags){if(g=='rare'&&p.r==3)w*=3;else if(p.tags.includes(g))w*=3}if(p.season)w*=2;return[p,w]});

 const finish=()=>{if(done)return;done=true;clearTimeout(timer);silenceForAd(false)};

addEventListener('resize',sizeCv);

function drawFx(t,dt){const W=cv.width,H=cv.height;cx.clearRect(0,0,W,H);if(tab!='home'||RM)return;const r=viewRoom(),h=hourAt(Date.now()),wt=weatherAt(Date.now()),out=['balcony','pond','porch'].includes(r);

 if(rain=='rain'){cx.strokeStyle='rgba(225,240,255,.55)';cx.lineWidth=1.3*devicePixelRatio;cx.beginPath();for(const d of drops){d.y+=d.v*dt/1000;d.x-=.08*dt/1000;if(d.y>1){d.y=-.05;d.x=Math.random()*1.1}if(d.x<0)d.x+=1;cx.moveTo(d.x*W,d.y*H);cx.lineTo((d.x-.008)*W,(d.y+d.l)*H)}cx.stroke()}
 if(rain=='snow'){cx.fillStyle='rgba(255,255,255,.9)';for(const d of drops){d.y+=d.v*.12*dt/1000;d.x+=Math.sin(t/1000+d.l*100)*.0004;if(d.y>1){d.y=-.02;d.x=Math.random()}cx.beginPath();cx.arc(d.x*W,d.y*H,(1.5+d.l*40)*devicePixelRatio,0,7);cx.fill()}}
 if(r=='reading'||((h>=19||h<5)&&out&&seasonAt(Date.now())!='winter')){const area=r=='reading'?[0,.25]:[0,1];for(const f of flies){f.p+=dt/1000*f.s;const x=(area[0]+(area[1]-area[0])*f.x+Math.sin(f.p*.7)*.02)*W,y=(f.y+Math.cos(f.p*.5)*.03)*H,a=.35+.65*Math.max(0,Math.sin(f.p*2));
  const g=cx.createRadialGradient(x,y,0,x,y,9*devicePixelRatio);g.addColorStop(0,`rgba(255,250,170,${a})`);g.addColorStop(1,'rgba(255,240,120,0)');cx.fillStyle=g;cx.fillRect(x-10*devicePixelRatio,y-10*devicePixelRatio,20*devicePixelRatio,20*devicePixelRatio)}}

  wdrops=wdrops.filter(d=>{d.v+=dt/1000*.9;d.y+=d.v*dt/1000;cx.beginPath();cx.arc(d.x*W,d.y*H,2.2*devicePixelRatio,0,7);cx.fill();return d.y<(100-a.b+1)/100})}}
