<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>团子去旅行</title>
<style>
:root{--ink:#3a2e24;--g:#7fae55;--gd:#4f7f3a;--cream:#fbf4e2;--card:#fffaf0;--yel:#f3d77a;--pink:#ecb3a6}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:#dfe8cc;color:var(--ink);display:flex;justify-content:center}
#app{width:min(760px,100vw);min-height:100vh;background:var(--cream);position:relative;overflow:hidden;box-shadow:0 0 0 2px var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(#a6cc7a,#8cbc63);border-bottom:2px solid var(--ink);font-weight:700;font-size:18px}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:3px 12px;font-size:15px}
button{font:inherit;cursor:pointer;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:7px 14px;box-shadow:0 3px 0 var(--ink);transition:.1s;color:var(--ink)}
button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.45;cursor:default}
.scene{position:relative;width:100%;aspect-ratio:1600/893;border-bottom:2px solid var(--ink);overflow:hidden;background:#cfe0b8}
.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;pointer-events:none}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 14px}
nav button{padding:9px 2px;font-size:14px}nav button.on{background:var(--yel)}
.panel{padding:2px 16px 24px}.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;margin:8px 0}
.row{display:flex;gap:12px;align-items:center}.row img{width:110px;flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{text-align:center;font-size:14px;cursor:pointer}.item .ic{font-size:30px}
.item.sel{background:#fbe9a8;box-shadow:inset 0 0 0 2px var(--gd)}
h4{margin:12px 0 4px}
.leaf{position:absolute;top:-4%;width:1.6%;aspect-ratio:3/2;border:1.5px solid var(--ink);border-radius:0 80% 0 80%;animation:fall linear infinite;pointer-events:none;z-index:3}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(4vw,25vw) rotate(180deg)}100%{transform:translate(-1vw,60vw) rotate(360deg)}}
.breathe{animation:br 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes br{50%{transform:scale(1.035,.965)}}
.steam{width:1.4%;height:6%;border-left:3px solid #fff;border-radius:50%;opacity:0;animation:st 2.6s ease-out infinite;filter:blur(.4px)}
@keyframes st{0%{transform:translateY(0) scaleX(1);opacity:0}30%{opacity:.85}100%{transform:translateY(-130%) scaleX(-1);opacity:0}}
.clover{position:absolute;width:5.5%;cursor:pointer;z-index:2;transition:transform .2s;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
.clover:hover{transform:scale(1.18)}.clover.gone{opacity:.0;pointer-events:none}
@keyframes sway{50%{rotate:6deg}}
.hot{position:absolute;cursor:pointer;z-index:2}
.badge{position:absolute;background:#e86a55;color:#fff;border:2px solid var(--ink);border-radius:12px;padding:0 7px;font-size:13px;font-weight:700;animation:bob 1.2s ease-in-out infinite;pointer-events:none;z-index:4}
@keyframes bob{50%{transform:translateY(-5px)}}
.note{position:absolute;left:55.5%;top:65%;width:10%;min-height:19%;display:flex;flex-direction:column;justify-content:center;background:#fffaf0;border:2px solid var(--ink);border-radius:8px;padding:4px;font-size:clamp(9px,1.6vw,13px);text-align:center;rotate:-4deg;box-shadow:2px 3px 0 #0003;line-height:1.3}
.walker{position:absolute;left:52%;top:60%;width:11%;animation:walkout 3s ease-in forwards;z-index:5}
@keyframes walkout{0%{transform:translateX(0)}20%{transform:translateX(0) translateY(-6%)}100%{transform:translateX(230%);opacity:0}}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 16px;z-index:20;animation:pop 2.6s forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.modal{position:fixed;inset:0;background:#2a20184d;display:flex;align-items:center;justify-content:center;z-index:30}
.modal .card{width:92%;max-width:520px;text-align:center}
.pc img{width:100%;border:2px solid var(--ink);border-radius:10px;display:block}
.album .card{padding:8px;cursor:pointer}.album small{display:block;margin-top:4px}
small{color:#7a6a58}
</style></head><body><div id="app">
<header><span>🍃 团子去旅行</span><span><span class="pill">🍀 <b id="cl">0</b></span> <button id="spd" title="时间倍速" style="padding:2px 10px;font-size:14px">×1</button></span></header>
<div class="scene" id="scene"></div>
<nav><button data-t="home">小屋</button><button data-t="garden">庭院</button><button data-t="shop">商店</button><button data-t="bag">行囊</button><button data-t="album">相册</button></nav>
<div class="panel" id="panel"></div></div>
<script>
const K='cozy-tabi-v2',A='assets/';
const FOODS=[{id:'bun',n:'艾草团子',ic:'🍡',p:5,t:.8},{id:'onigiri',n:'海苔饭团',ic:'🍙',p:12,t:1.2},{id:'bento',n:'森林便当',ic:'🍱',p:25,t:1.6}];
const CHARMS=[{id:'acorn',n:'橡果护符',ic:'🌰',p:15,d:'更容易去森林'},{id:'bell',n:'小铃铛',ic:'🔔',p:20,d:'带回更多三叶草'},{id:'shell',n:'蓝贝壳',ic:'🐚',p:30,d:'更容易去远方'}];
const PLACES=[{id:'train',n:'被藤蔓覆盖的旧车厢',txt:'车厢里长满了蕨类，我在红色座椅上晒了一下午太阳。'},{id:'camper',n:'森林里的露营车',txt:'在露营车里弹了吉他，听了一整夜虫鸣。'},{id:'dome',n:'丛林玻璃温室',txt:'玻璃穹顶下有好多从没见过的大叶子！'},{id:'village',n:'树荫下的小镇',txt:'小镇的房顶都长着青苔，面包店老板送了我一块面包。'}];
const SOUV=['🍄 小蘑菇','🪶 羽毛','🌸 干花','🪨 圆石头','🎐 风铃','🍯 蜂蜜罐','🌰 橡果帽'];
// clover spots on garden art (% of scene)
const SPOTS=[[13,66],[21,72],[29,64],[37,70],[45,63],[17,80],[33,79],[49,76]];
const REGROW=20000;
const def={clover:20,inv:{bun:1},bag:{food:null,charm:null},away:null,album:[],souv:[],grow:Array(8).fill(0),speed:1,mail:[]};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S={...def}}
const save=()=>localStorage.setItem(K,JSON.stringify(S));
let tab=location.hash.slice(1)||'home',walking=0;const $=id=>document.getElementById(id);
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('app').appendChild(d);setTimeout(()=>d.remove(),2700)}
let ac;function beep(f=660){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
const CLV=`<svg viewBox="-20 -24 40 50"><path d="M0,6 q2,10 -3,18" fill="none" stroke="#3a2e24" stroke-width="3"/>${[0,120,240].map(a=>`<path transform="rotate(${a})" d="M0,0 C-14,-6 -12,-22 0,-14 C12,-22 14,-6 0,0Z" fill="#6fb04d" stroke="#3a2e24" stroke-width="2.5"/>`).join('')}</svg>`;
function leaves(n=7){let h='';for(let i=0;i<n;i++)h+=`<div class="leaf" style="left:${5+Math.random()*85}%;animation-duration:${7+Math.random()*6}s;animation-delay:${-Math.random()*12}s;background:${['#9cc867','#f0c766','#e59156','#c9d97a'][i%4]}"></div>`;return h}
function renderScene(){let h='';
if(tab=='garden'){h=`<img class="bg" src="${A}garden.jpg" alt="庭院">`;
 SPOTS.forEach(([x,y],i)=>h+=`<div class="clover ${S.grow[i]>0?'gone':''}" data-i="${i}" style="left:${x-2.7}%;top:${y-6}%;animation-delay:${-i*.4}s">${CLV}</div>`);
 h+=`<div class="hot" id="mailbox" title="信箱" style="left:53%;top:56%;width:9%;height:28%"></div>`;
 if(S.mail.length)h+=`<div class="badge" style="left:57%;top:57%">${S.mail.length}</div>`;
}else{const home=!S.away&&!walking;
 h=`<img class="bg" src="${A}home_empty.jpg" alt="小屋">`;
 if(home)h+=`<img class="ov breathe" src="${A}blob_home.png" style="left:57%;top:66.85%;width:6.125%">`;
 else h+=`<div class="note">出门旅行中～<br>🎒</div>`;
 h+=[0,1,2].map(i=>`<div class="ov steam" style="left:${52.4+i*.7}%;top:${62.5-i}%;animation-delay:${i*.85}s"></div>`).join('');
 h+=`<div class="ov steam" style="left:49.6%;top:70%;animation-delay:.4s;height:4%"></div><div class="ov steam" style="left:55.6%;top:70%;animation-delay:1.6s;height:4%"></div>`;
 if(walking)h+=`<img class="walker" src="${A}blob_walk.png">`;
 if(S.mail.length)h+=`<div class="badge" style="left:47%;top:4%">📮 有 ${S.mail.length} 封明信片，去庭院信箱看看</div>`;
}
$('scene').innerHTML=h+leaves();
$('scene').querySelectorAll('.clover').forEach(c=>c.onclick=()=>pickClover(+c.dataset.i));
const mb=$('mailbox');if(mb)mb.onclick=()=>S.mail.length?openMail():toast('信箱是空的')}
function pickClover(i){if(S.grow[i]>0)return;const lucky=Math.random()<.15,n=lucky?4:1;S.clover+=n;S.grow[i]=REGROW;beep(lucky?880:660);if(lucky)toast('幸运四叶草！+4');save();render()}
const sec=ms=>Math.max(0,Math.ceil(ms/1000/S.speed))+' 秒';
function renderPanel(){let h='';const inv=S.inv;
if(tab=='home'){h=S.away?`<div class="card row"><img src="${A}blob_walk.png"><div>团子正在旅行中……<br>大约 <b id="cd">${sec(S.away.remain)}</b> 后回家。</div></div>`
 :`<div class="card row"><img class="breathe" src="${A}blob_${Math.random()<.5?'sit':'eat'}.png"><div>团子在小屋里悠闲地喝茶。<br>给它准备好<b>行囊</b>，它就会自己出门旅行哦。</div></div>`;
 if(S.mail.length)h+=`<button id="readmail" onclick="openMail()">📮 读明信片（${S.mail.length}）</button>`;
 h+=`<div class="card"><b>收藏的纪念品</b><br>${S.souv.length?S.souv.join('　'):'<small>还没有，等团子带回来吧</small>'}</div>`}
if(tab=='garden'){const g=S.grow.filter(x=>x>0).length;h=`<div class="card">点一点草地上的三叶草来收集 🍀。摘下后约 ${REGROW/1000/S.speed} 秒长回来（${8-g}/8 可摘），偶尔会有幸运四叶草。<br><small>点信箱可以收明信片。</small></div>`}
if(tab=='shop')h=`<h4>食物</h4><div class="grid">${FOODS.map(f=>`<div class="card item"><div class="ic">${f.ic}</div>${f.n}<br><small>🍀${f.p} · 持有 ${inv[f.id]||0}</small><br><button data-buy="${f.id}" ${S.clover<f.p?'disabled':''}>购买</button></div>`).join('')}</div><h4>护身符</h4><div class="grid">${CHARMS.map(f=>`<div class="card item"><div class="ic">${f.ic}</div>${f.n}<br><small>${f.d}<br>🍀${f.p} · 持有 ${inv[f.id]||0}</small><br><button data-buy="${f.id}" ${S.clover<f.p?'disabled':''}>购买</button></div>`).join('')}</div>`;
if(tab=='bag'){if(S.away)h=`<div class="card row"><img src="${A}blob_walk.png"><div>团子已经背着行囊出发啦～</div></div>`;else{
 h=`<div class="card row"><img class="breathe" src="${A}blob_walk.png"><div>选 <b>一份食物</b>（必选）和 <b>一个护身符</b>（可选），整理好行囊，团子就会出门旅行。</div></div>
 <h4>食物</h4><div class="grid">${FOODS.filter(f=>inv[f.id]>0).map(f=>`<div class="card item ${S.bag.food==f.id?'sel':''}" data-pick="food:${f.id}"><div class="ic">${f.ic}</div>${f.n} ×${inv[f.id]}</div>`).join('')||'<small>没有食物，去商店买吧</small>'}</div>
 <h4>护身符</h4><div class="grid">${CHARMS.filter(f=>inv[f.id]>0).map(f=>`<div class="card item ${S.bag.charm==f.id?'sel':''}" data-pick="charm:${f.id}"><div class="ic">${f.ic}</div>${f.n}</div>`).join('')||'<small>暂无</small>'}</div>
 <p><button id="go" ${S.bag.food&&inv[S.bag.food]>0?'':'disabled'}>🎒 整理好了，出发吧！</button></p>`}}
if(tab=='album'){const got=new Set(S.album.map(a=>a.id)).size;h=`<div class="card">已收集 ${got}/${PLACES.length} 处风景 · 明信片 ${S.album.length} 张</div><div class="grid album" style="grid-template-columns:1fr 1fr">${S.album.map((a,i)=>`<div class="card pc" data-pc="${i}"><img src="${A}pc_${a.id}.jpg" loading="lazy"><small>${PLACES.find(p=>p.id==a.id).n}</small></div>`).join('')||'<small>还没有明信片</small>'}</div>`}
$('panel').innerHTML=h;
$('panel').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));
$('panel').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.pick.split(':');S.bag[k]=S.bag[k]==id?null:id;save();renderPanel()});
$('panel').querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>showPc(S.album[+b.dataset.pc]));
const go=$('go');if(go)go.onclick=depart}
function render(){$('cl').textContent=S.clover;$('spd').textContent='×'+S.speed;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));renderScene();renderPanel()}
function buy(id){const it=[...FOODS,...CHARMS].find(x=>x.id==id);if(S.clover<it.p)return;S.clover-=it.p;S.inv[id]=(S.inv[id]||0)+1;beep(520);toast(`买到了 ${it.ic}${it.n}`);save();render()}
function depart(){const f=FOODS.find(x=>x.id==S.bag.food);if(!f||!(S.inv[f.id]>0))return;S.inv[f.id]--;const c=S.bag.charm&&S.inv[S.bag.charm]>0?S.bag.charm:null;if(c)S.inv[c]--;
S.away={food:f.id,charm:c,remain:Math.round((30+Math.random()*60)*1000*f.t)};S.bag={food:null,charm:null};save();beep(440);
tab='home';walking=1;render();toast('团子背上行囊出门了～');setTimeout(()=>{walking=0;render()},3000)}
function comeHome(){const c=S.away.charm;let pool=PLACES.map(p=>p.id);if(c=='acorn')pool.push('camper','camper');if(c=='shell')pool.push('dome','village');
const id=pool[Math.floor(Math.random()*pool.length)];S.mail.push({id,sv:SOUV[Math.floor(Math.random()*SOUV.length)],cl:5+Math.floor(Math.random()*8)+(c=='bell'?10:0),t:Date.now()});S.away=null;save();beep(990);
const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card"><img src="${A}blob_sleep.png" style="width:60%"><p>团子旅行回来了，累得睡着了……<br>信箱里好像多了一张明信片 📮</p><button id="okback">好的</button></div>`;
document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove();render()}
let last=Date.now();
function tick(){const now=Date.now(),dt=(now-last)*S.speed;last=now;let ch=false;
S.grow=S.grow.map(t=>{if(t>0){t-=dt;if(t<=0){ch=true;return 0}}return t});
if(S.away){S.away.remain-=dt;if(S.away.remain<=0)comeHome();else{const cd=$('cd');if(cd)cd.textContent=sec(S.away.remain)}}
save();if(ch&&tab=='garden')render()}
function openMail(){const m=S.mail.shift();if(!m)return;S.album.push({id:m.id,t:m.t});S.souv.push(m.sv);S.clover+=m.cl;save();render();const p=PLACES.find(x=>x.id==m.id);
const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card pc"><img src="${A}pc_${m.id}.jpg"><p><b>${p.n}</b><br>${p.txt}</p><p>带回了：${m.sv}，还有 🍀${m.cl}</p><button id="keep">收进相册</button></div>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
function showPc(a){const p=PLACES.find(x=>x.id==a.id);const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card pc"><img src="${A}pc_${a.id}.jpg"><p><b>${p.n}</b><br>${p.txt}</p><button>关闭</button></div>`;d.onclick=()=>d.remove();document.body.appendChild(d)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('spd').onclick=()=>{S.speed={1:2,2:5,5:1}[S.speed]||1;save();render()};
render();setInterval(tick,500);
</script></body></html>
